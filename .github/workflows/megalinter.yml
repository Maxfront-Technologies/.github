name: Organization MegaLinter

# See. https://github.com/oxsecurity/megalinter/blob/main/.mega-linter.yml for env variables and their default values.

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10
        env:
          EXTENDS: https://raw.githubusercontent.com/Maxfront-Technologies/.github/main/.mega-linter-base.yml
          APPLY_FIXES: none
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref }}
          GITHUB_STATUS_REPORTER: false
          DISABLE: COPYPASTE,SPELL
          POST_GITHUB_COMMENT: true