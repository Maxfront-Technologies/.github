name: Organization MegaLinter

# See https://github.com/oxsecurity/megalinter/blob/main/.mega-linter.yml for env variables and their default values.

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: write   # was: read — needed for GITHUB_COMMENT_REPORTER to post
  issues: write          # was missing — also needed for GITHUB_COMMENT_REPORTER
  checks: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false   # was: true — not needed, APPLY_FIXES is none

      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              branch="${{ github.event.pull_request.base.ref }}"
              ;;
            merge_group)
              branch="${{ github.event.merge_group.base_ref }}"
              branch="${branch#refs/heads/}"
              ;;
            *)
              branch=""
              ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10
        env:
          EXTENDS: https://raw.githubusercontent.com/Maxfront-Technologies/.github/main/.mega-linter-base.yml
          APPLY_FIXES: none
          VALIDATE_ALL_CODEBASE: ${{ steps.target.outputs.branch == '' }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_STATUS_REPORTER: false
          DISABLE: COPYPASTE,SPELL
          GITHUB_COMMENT_REPORTER: true   # was: POST_GITHUB_COMMENT (not a current variable)