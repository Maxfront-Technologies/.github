name: Organization MegaLinter

# See. https://github.com/oxsecurity/megalinter/blob/main/.mega-linter.yml for env variables and their default values.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v10
        env:
          APPLY_FIXES: none
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPORTERS_MARKDOWN_SUMMARY_TYPE: table-sections
          GITHUB_STATUS_REPORTER: false
          DISABLE: COPYPASTE,SPELL
          POST_GITHUB_COMMENT: true
          ENABLE: CSHARP,CSS,TYPESCRIPT,JAVASCRIPT,API,DOCKERFILE,EDITORCONFIG,ENV,HTML